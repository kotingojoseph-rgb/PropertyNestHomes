services:
  - type: web
    runtime: static
    name: PropertyNestHomes-frontend
    repo: https://github.com/kotingojoseph-rgb/PropertyNestHomes
    branch: main
    autoDeployTrigger: commit
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    previews:
      generation: off

    routes:
      - type: rewrite
        source: /buy
        destination: /buy/index.html

      - type: rewrite
        source: /about
        destination: /about/index.html

      - type: rewrite
        source: /contact
        destination: /contact/index.html

      - type: rewrite
        source: /privacy-policy
        destination: /privacy-policy/index.html

      - type: rewrite
        source: /terms
        destination: /terms/index.html

      - type: rewrite
        source: /guides
        destination: /guides/index.html

      - type: rewrite
        source: /guides/*
        destination: /guides/*/index.html

      - type: rewrite
        source: /property/*
        destination: /property/*/index.html

      - type: rewrite
        source: /*
        destination: /index.html
